<article class="group card h-full">
  <a [routerLink]="['/blog', post().slug]" class="block">
    <div class="relative h-52 overflow-hidden">
      <img
        [src]="post().image"
        [alt]="post().title"
        class="absolute inset-0 size-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
      />
      <div
        class="absolute inset-0 bg-linear-to-t from-black/60 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
      ></div>
      <span
        class="absolute top-4 right-4 rounded-full border border-line-strong bg-ink/80 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm"
      >
        {{ post().category }}
      </span>
    </div>

    <div class="p-6">
      <div class="mb-3 flex items-center gap-3 text-sm text-neutral-500">
        <span class="flex items-center gap-1">
          <i class="fa-regular fa-clock"></i>
          {{ post().readTime }}
        </span>
        <span class="size-1 rounded-full bg-neutral-600"></span>
        <span>{{ post().date | arDate }}</span>
      </div>

      <h3
        class="mb-3 line-clamp-2 text-xl leading-tight font-bold text-white transition-colors duration-300 group-hover:text-orange-500"
      >
        {{ post().title }}
      </h3>
      <p class="mb-5 line-clamp-2 text-sm leading-relaxed text-neutral-400">{{ post().excerpt }}</p>

      <div class="flex items-center justify-between border-t border-line pt-4">
        <div class="flex items-center gap-3">
          <img
            [src]="post().author.avatar"
            [alt]="post().author.name"
            width="36"
            height="36"
            class="rounded-full object-cover ring-2 ring-line"
          />
          <div>
            <p class="text-sm font-medium text-white">{{ post().author.name }}</p>
            <p class="text-xs text-neutral-500">{{ post().author.role }}</p>
          </div>
        </div>
        <div
          class="flex size-8 items-center justify-center rounded-full border border-orange-500/20 bg-orange-500/10 transition-colors duration-300 group-hover:border-transparent group-hover:bg-orange-500"
        >
          <i
            class="fa-solid fa-arrow-left text-xs text-orange-500 transition-colors duration-300 group-hover:text-white"
          ></i>
        </div>
      </div>
    </div>
  </a>
</article>
