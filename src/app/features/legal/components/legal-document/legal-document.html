<div class="bg-ink">
  <header class="relative overflow-hidden py-20">
    <div class="absolute inset-0 bg-ink"></div>
    <div class="bg-grid absolute inset-0"></div>
    <div class="absolute inset-0 opacity-30">
      <div class="absolute top-20 right-20 size-72 rounded-full bg-orange-500/20 blur-[100px]"></div>
    </div>

    <div class="relative mx-auto max-w-4xl px-4 text-center sm:px-6 lg:px-8">
      <app-breadcrumb class="mb-8 block" [items]="breadcrumb()" [variant]="'plain'" />

      <div
        class="mb-6 inline-flex size-16 items-center justify-center rounded-2xl border border-orange-500/30 bg-orange-500/10 backdrop-blur-sm"
      >
        <i class="fa-solid {{ document().icon }} text-3xl text-orange-500"></i>
      </div>
      <h1 class="mb-4 text-4xl font-bold text-white md:text-5xl">{{ document().title }}</h1>
      <p class="text-lg text-neutral-400">آخر تحديث: {{ document().updatedAt }}</p>
    </div>
  </header>

  <div class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
    <div class="mb-12 rounded-2xl border border-orange-500/20 bg-orange-500/10 p-6">
      <div class="flex gap-4">
        <div class="shrink-0">
          <i class="fa-solid {{ document().notice.icon }} size-6 text-center text-xl leading-6 text-orange-500"></i>
        </div>
        <div>
          <h3 class="mb-1 font-semibold text-orange-500">{{ document().notice.title }}</h3>
          <p class="text-sm text-orange-300/80">{{ document().notice.text }}</p>
        </div>
      </div>
    </div>

    <div class="space-y-12">
      @for (section of document().sections; track section.title; let i = $index) {
        <app-legal-section [section]="section" [index]="i + 1" />
      }
    </div>

    <div class="mt-16 border-t border-line pt-8">
      <p class="text-center text-sm text-neutral-500">
        {{ document().closing.text }}
        <a [routerLink]="document().closing.link" class="font-medium text-orange-500 hover:text-orange-400">{{
          document().closing.linkLabel
        }}</a
        >.
      </p>
    </div>
  </div>
</div>
