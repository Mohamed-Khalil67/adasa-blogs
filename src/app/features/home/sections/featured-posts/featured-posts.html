<section class="relative overflow-hidden bg-ink py-24">
  <div class="absolute top-0 right-0 h-full w-1/3 bg-linear-to-l from-orange-500/5 to-transparent"></div>
  <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <app-section-heading
      label="مميز"
      title="مقالات مختارة"
      subtitle="محتوى منتقى لبدء رحلة تعلمك"
      linkLabel="عرض الكل"
      [linkStyle]="'button'"
    />

    <div class="space-y-8">
      @for (post of posts; track post.id) {
        <article
          class="group relative overflow-hidden rounded-3xl border border-line bg-card transition-all duration-500 hover:border-orange-500/30"
        >
          <a [routerLink]="['/blog', post.slug]" class="block">
            <div class="grid md:grid-cols-2">
              <!-- Image (first grid column, so on the right in RTL) -->
              <div class="relative h-72 overflow-hidden md:h-100">
                <img
                  [src]="post.image"
                  [alt]="post.title"
                  class="absolute inset-0 size-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
                />
                <div
                  class="absolute inset-0 bg-linear-to-t from-black/50 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"
                ></div>
                <div class="absolute top-4 right-4">
                  <span
                    class="inline-flex items-center gap-1.5 rounded-full bg-linear-to-r from-orange-500 to-yellow-500 px-3 py-1.5 text-xs font-semibold text-white"
                  >
                    <i class="fa-solid fa-star text-[11px]"></i>
                    مميز
                  </span>
                </div>
              </div>

              <!-- Content -->
              <div class="flex flex-col justify-center bg-card p-8 md:p-10">
                <div class="mb-4 flex items-center gap-3">
                  <span
                    class="inline-block rounded-full border border-orange-500/20 bg-orange-500/10 px-3 py-1 text-xs font-semibold text-orange-500"
                  >
                    {{ post.category }}
                  </span>
                  <span class="flex items-center gap-1 text-sm text-neutral-500">
                    <i class="fa-regular fa-clock"></i>
                    {{ post.readTime }}
                  </span>
                </div>

                <h2
                  class="mb-4 text-2xl leading-tight font-bold text-white transition-colors duration-300 group-hover:text-orange-500 md:text-3xl"
                >
                  {{ post.title }}
                </h2>
                <p class="mb-6 line-clamp-3 leading-relaxed text-neutral-400">{{ post.excerpt }}</p>

                <div class="mt-auto flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="relative shrink-0">
                      <img
                        [src]="post.author.avatar"
                        [alt]="post.author.name"
                        width="48"
                        height="48"
                        class="rounded-full object-cover shadow-md ring-2 ring-line"
                      />
                      <span
                        class="absolute -bottom-1 -left-1 size-4 rounded-full border-2 border-card bg-orange-500"
                      ></span>
                    </div>
                    <div>
                      <p class="text-sm font-semibold text-white">{{ post.author.name }}</p>
                      <p class="text-xs text-neutral-500">{{ post.date | arDate }}</p>
                    </div>
                  </div>
                  <span
                    class="inline-flex items-center gap-2 text-sm font-semibold text-orange-500 transition-all duration-300 group-hover:gap-3"
                  >
                    اقرأ المقال
                    <i class="fa-solid fa-arrow-left"></i>
                  </span>
                </div>
              </div>
            </div>
          </a>
        </article>
      }
    </div>
  </div>
</section>
