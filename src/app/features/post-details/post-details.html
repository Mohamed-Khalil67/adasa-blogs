<article class="min-h-screen bg-ink">
  <app-post-hero [post]="post()" />

  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="grid gap-12 lg:grid-cols-[1fr_300px]">
      <div class="order-2 lg:order-1">
        <app-post-body [excerpt]="post().excerpt" [blocks]="content().blocks" />
        <app-post-tags [tags]="post().tags" />
        <app-share-buttons />
        <app-author-box [author]="post().author" />
      </div>

      <aside class="order-1 lg:order-2">
        <app-post-sidebar [post]="post()" [toc]="content().toc" />
      </aside>
    </div>

    @if (relatedPosts().length) {
      <app-related-posts [posts]="relatedPosts()" />
    }
  </div>
</article>
