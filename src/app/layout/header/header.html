<nav
  aria-label="التنقل الرئيسي"
  class="fixed top-0 right-0 left-0 z-50 border-b bg-ink/95 backdrop-blur-xl transition-all duration-500"
  [class]="scrolled() ? 'border-line shadow-2xl shadow-black/40' : 'border-transparent'"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-20 items-center justify-between">
      <app-logo />

      <app-nav-links class="hidden items-center md:flex" />

      <div class="hidden items-center gap-3 md:flex">
        <button
          type="button"
          aria-label="البحث في المقالات"
          (click)="openSearch()"
          class="cursor-pointer rounded-xl border border-transparent p-3 text-neutral-500 transition-all duration-300 hover:border-line hover:bg-card hover:text-orange-500"
        >
          <i class="fa-solid fa-magnifying-glass block size-5 text-lg leading-5"></i>
        </button>
        <a routerLink="/blog" class="btn-primary text-sm">ابدأ القراءة</a>
      </div>

      <button
        type="button"
        class="cursor-pointer rounded-xl border border-transparent p-3 text-neutral-400 transition-all duration-300 hover:border-line hover:bg-card hover:text-white md:hidden"
        [attr.aria-label]="menuOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMenu()"
      >
        <i class="fa-solid block size-6 text-xl leading-6" [class]="menuOpen() ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
    </div>

    <app-mobile-menu [open]="menuOpen()" />
  </div>
</nav>
