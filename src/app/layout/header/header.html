<nav
  aria-label="التنقل الرئيسي"
  class="fixed top-0 right-0 left-0 z-50 border-b bg-card backdrop-blur-xl transition-all duration-500"
  [class]="scrolled() ? 'border-line shadow-2xl shadow-black/40' : 'border-transparent'"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-20 items-center justify-between">
      <!-- Logo -->
      <a routerLink="/" class="group flex items-center gap-3">
        <div class="relative size-12 overflow-hidden rounded-xl transition-all duration-300 group-hover:scale-105">
          <img src="logo.png" alt="Photography Logo" width="48" height="48" class="size-full object-cover" />
        </div>
        <div class="flex flex-col">
          <span class="bg-linear-to-r from-white to-neutral-300 bg-clip-text text-xl font-bold text-transparent">
            عدسة
          </span>
          <span class="hidden text-xs tracking-wide text-orange-400/80 sm:block">عالم التصوير الفوتوغرافي</span>
        </div>
      </a>

      <!-- Desktop links -->
      <div class="hidden items-center md:flex">
        <div class="flex items-center rounded-full border border-line bg-card p-1.5">
          <a
            routerLink="/"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            الرئيسية
          </a>
          <a
            routerLink="/blog"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            المدونة
          </a>
          <a
            routerLink="/about"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            من نحن
          </a>
        </div>
      </div>

      <!-- Desktop actions -->
      <div class="hidden items-center gap-3 md:flex">
        <a
          routerLink="/blog"
          aria-label="البحث في المقالات"
          class="cursor-pointer rounded-xl border border-transparent p-3 text-neutral-500 transition-all duration-300 hover:border-line hover:bg-card hover:text-orange-500"
        >
          <i class="fa-solid fa-magnifying-glass block size-5 text-lg leading-5"></i>
        </a>
        <a routerLink="/blog" class="btn-primary text-sm">ابدأ القراءة</a>
      </div>

      <!-- Mobile menu toggle -->
      <button
        type="button"
        class="cursor-pointer rounded-xl border border-transparent p-3 text-neutral-400 transition-all duration-300 hover:border-line hover:bg-card hover:text-white md:hidden"
        [attr.aria-label]="menuOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="menuOpen.set(!menuOpen())"
      >
        <i class="fa-solid block size-6 text-xl leading-6" [class]="menuOpen() ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
    </div>

    <!-- Mobile menu: slides open via max-height -->
    <div
      id="mobile-menu"
      class="overflow-hidden transition-all duration-300 md:hidden"
      [class]="menuOpen() ? 'max-h-96 pb-4' : 'max-h-0'"
      [attr.aria-hidden]="!menuOpen()"
      [attr.inert]="menuOpen() ? null : ''"
    >
      <div class="rounded-2xl border border-line bg-card p-4 backdrop-blur-xl">
        <!-- Any link in here navigates, so closing the menu on click covers them all. -->
        <div class="flex flex-col space-y-1" (click)="menuOpen.set(false)">
          <a
            routerLink="/"
            routerLinkActive="border-orange-500/30 bg-orange-500/10 !text-orange-500 hover:bg-orange-500/10"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="rounded-xl border border-transparent px-4 py-3 text-sm font-medium text-neutral-400 transition-all duration-300 hover:bg-elevated hover:text-white"
          >
            الرئيسية
          </a>
          <a
            routerLink="/blog"
            routerLinkActive="border-orange-500/30 bg-orange-500/10 !text-orange-500 hover:bg-orange-500/10"
            ariaCurrentWhenActive="page"
            class="rounded-xl border border-transparent px-4 py-3 text-sm font-medium text-neutral-400 transition-all duration-300 hover:bg-elevated hover:text-white"
          >
            المدونة
          </a>
          <a
            routerLink="/about"
            routerLinkActive="border-orange-500/30 bg-orange-500/10 !text-orange-500 hover:bg-orange-500/10"
            ariaCurrentWhenActive="page"
            class="rounded-xl border border-transparent px-4 py-3 text-sm font-medium text-neutral-400 transition-all duration-300 hover:bg-elevated hover:text-white"
          >
            من نحن
          </a>
          <a routerLink="/blog" class="btn-primary mt-2 text-center text-sm">ابدأ القراءة</a>
        </div>
      </div>
    </div>
  </div>
</nav>
