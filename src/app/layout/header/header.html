<nav
  aria-label="التنقل الرئيسي"
  class="fixed top-0 right-0 left-0 z-50 border-b bg-card backdrop-blur-xl transition-all duration-500"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-20 items-center justify-between">
      <!-- Logo -->
      <a routerLink="/" class="group flex items-center gap-3">
        <div class="relative size-12 overflow-hidden rounded-xl transition-all duration-300 group-hover:scale-105">
          <img src="logo.png" alt="Photography Logo" width="48" height="48" class="size-full object-cover" />
        </div>
        <div class="flex flex-col">
          <span class="bg-linear-to-r from-white to-neutral-300 bg-clip-text text-xl font-bold text-transparent">
            عدسة
          </span>
          <span class="hidden text-xs tracking-wide text-orange-400/80 sm:block">عالم التصوير الفوتوغرافي</span>
        </div>
      </a>

      <!-- Desktop links -->
      <div class="hidden items-center md:flex">
        <div class="flex items-center rounded-full border border-line bg-card p-1.5">
          <a
            routerLink="/home"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            الرئيسية
          </a>
          <a
            routerLink="/blog"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            المدونة
          </a>
          <a
            routerLink="/about"
            routerLinkActive="bg-linear-to-r from-orange-500 to-orange-600 !text-white"
            ariaCurrentWhenActive="page"
            class="rounded-full px-5 py-2.5 text-sm font-medium text-neutral-400 transition-all duration-300 hover:text-white"
          >
            من نحن
          </a>
        </div>
      </div>

      <!-- Desktop actions -->
      <div class="hidden items-center gap-3 md:flex">
        <a routerLink="/blog" class="btn-primary text-sm">ابدأ القراءة</a>
      </div>


      <!-- Mobile menu: native popover driven by daisyUI's dropdown, so it needs no component state.
           The popover handles toggling, Esc, click-outside and aria-expanded on the button. -->
      <div class="group md:hidden">
        <button
          type="button"
          class="cursor-pointer rounded-xl border border-transparent p-3 text-neutral-400 transition-all duration-300 hover:border-line hover:bg-card hover:text-white"
          aria-label="القائمة"
          aria-controls="mobile-menu"
          popovertarget="mobile-menu"
          style="anchor-name: --mobile-menu"
        >
          <i class="fa-solid fa-bars block size-6 text-xl leading-6 group-has-[:popover-open]:hidden"></i>
          <i class="fa-solid fa-xmark hidden size-6 text-xl leading-6 group-has-[:popover-open]:block"></i>
        </button>

        <!-- Any link in here navigates, so closing the menu on click covers them all. -->
        <ul
          #mobileMenu
          id="mobile-menu"
          popover
          class="dropdown menu mt-2 w-64 gap-1 rounded-2xl border border-line bg-card p-3 shadow-2xl shadow-black/40"
          style="position-anchor: --mobile-menu"
          (click)="mobileMenu.hidePopover()"
        >
          <li>
            <a
              routerLink="/home"
              routerLinkActive="menu-active !text-primary"
              ariaCurrentWhenActive="page"
              class="px-4 py-3 text-sm font-medium"
            >
              الرئيسية
            </a>
          </li>
          <li>
            <a
              routerLink="/blog"
              routerLinkActive="menu-active !text-primary"
              ariaCurrentWhenActive="page"
              class="px-4 py-3 text-sm font-medium"
            >
              المدونة
            </a>
          </li>
          <li>
            <a
              routerLink="/about"
              routerLinkActive="menu-active !text-primary"
              ariaCurrentWhenActive="page"
              class="px-4 py-3 text-sm font-medium"
            >
              من نحن
            </a>
          </li>
          <li class="mt-2">
            <a routerLink="/blog" class="btn-primary text-center text-sm">ابدأ القراءة</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
